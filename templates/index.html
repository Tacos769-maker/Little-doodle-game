<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shared 2D Pixel World</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        /* Menu Overlay */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 18, 18, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        h1 { margin-bottom: 5px; color: #4674E9; }
        .menu-subtitle { color: #888; margin-bottom: 25px; }
        .play-btn {
            background-color: #4674E9;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .play-btn:hover {
            background-color: #355bc2;
            transform: scale(1.05);
        }

        /* Game Interface */
        #game-container {
            display: none;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 3px solid #333;
            background-color: #222222;
            cursor: crosshair;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .ui-bar {
            margin-top: 15px;
            display: flex;
            gap: 20px;
            align-items: center;
            background: #1e1e1e;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        #palette {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .color-btn {
            width: 25px;
            height: 25px;
            border: 2px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .color-btn.selected {
            border-color: #ffffff;
            transform: scale(1.2);
        }
        .eraser-btn {
            background-color: #444;
            color: white;
            border: 2px solid transparent;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .eraser-btn.selected {
            border-color: #ffffff;
            background-color: #c0392b;
            transform: scale(1.1);
        }
        .action-btn {
            background-color: #333;
            color: white;
            border: 1px solid #555;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .action-btn:hover { background-color: #444; }
        .instruction {
            margin-bottom: 8px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <!-- Start Menu -->
    <div id="menu-screen">
        <h1>Pixel Sandbox World</h1>
        <div class="menu-subtitle">Build and doodle together in real time</div>
        <button class="play-btn" onclick="startGame()">Play Game</button>
    </div>

    <!-- Game Screen -->
    <div id="game-container">
        <div class="instruction">Left-click & Drag: Draw/Erase lines | Right-click: Erase | Ctrl+Z: Undo</div>
        <canvas id="worldCanvas" width="1000" height="650"></canvas>
        
        <div class="ui-bar">
            <div id="palette">
                <!-- Color Palette -->
                <div class="color-btn selected" style="background-color: #FFFFFF;" onclick="selectColor('#FFFFFF', this)"></div>
                <div class="color-btn" style="background-color: #000000; border-color: #444;" onclick="selectColor('#000000', this)"></div>
                <div class="color-btn" style="background-color: #E74C3C;" onclick="selectColor('#E74C3C', this)"></div>
                <div class="color-btn" style="background-color: #E67E22;" onclick="selectColor('#E67E22', this)"></div>
                <div class="color-btn" style="background-color: #F1C40F;" onclick="selectColor('#F1C40F', this)"></div>
                <div class="color-btn" style="background-color: #2ECC71;" onclick="selectColor('#2ECC71', this)"></div>
                <div class="color-btn" style="background-color: #3498DB;" onclick="selectColor('#3498DB', this)"></div>
                <div class="color-btn" style="background-color: #9B59B6;" onclick="selectColor('#9B59B6', this)"></div>
                <div class="color-btn" style="background-color: #34495E;" onclick="selectColor('#34495E', this)"></div>
                
                <!-- Eraser Tool Button -->
                <button class="eraser-btn" onclick="selectEraser(this)">Eraser</button>
            </div>
            <button class="action-btn" onclick="undoAction()">Undo (Ctrl+Z)</button>
            <button class="action-btn" onclick="clearBoard()">Clear Board</button>
        </div>
    </div>

    <script>
        const socket = io();
        const canvas = document.getElementById('worldCanvas');
        const ctx = canvas.getContext('2d');
        
        const TILE_SIZE = 10; 
        let selectedColor = '#FFFFFF';
        let isEraser = false;
        let worldBlocks = {};
        let otherCursors = {};
        let myHistory = []; 

        function startGame() {
            document.getElementById('menu-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            drawWorld();
        }

        function selectColor(color, element) {
            selectedColor = color;
            isEraser = false;
            document.querySelectorAll('.color-btn, .eraser-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        function selectEraser(element) {
            isEraser = true;
            document.querySelectorAll('.color-btn, .eraser-btn').forEach(btn => btn.classList.remove('selected'));
            element.classList.add('selected');
        }

        function clearBoard() {
            socket.emit('clear_board');
        }

        function placeBlock(x, y, color, recordHistory = true) {
            let key = `${x},${y}`;
            let previousColor = worldBlocks[key] || null;

            // Only track if the color is actually changing
            if (recordHistory && previousColor !== color) {
                myHistory.push({ x: x, y: y, oldColor: previousColor });
            }

            socket.emit('place_block', {x: x, y: y, color: color});
        }

        function undoAction() {
            if (myHistory.length === 0) return;
            let lastAction = myHistory.pop();
            // Send the previous color back to the board without recording a new history action
            socket.emit('place_block', {x: lastAction.x, y: lastAction.y, color: lastAction.oldColor});
        }

        function drawWorld() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#2c2c2c';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += TILE_SIZE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += TILE_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            for (let key in worldBlocks) {
                let parts = key.split(',');
                let gx = parseInt(parts[0]);
                let gy = parseInt(parts[1]);
                ctx.fillStyle = worldBlocks[key];
                ctx.fillRect(gx * TILE_SIZE, gy * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }

            for (let id in otherCursors) {
                let cur = otherCursors[id];
                ctx.fillStyle = cur.color;
                ctx.fillRect(cur.x - 3, cur.y - 3, 6, 6);
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.strokeRect(cur.x - 3, cur.y - 3, 6, 6);
            }
        }

        socket.on('load_world', function(serverWorld) {
            worldBlocks = serverWorld;
            drawWorld();
        });

        socket.on('update_block', function(data) {
            let key = `${data.x},${data.y}`;
            if (data.color === null) {
                delete worldBlocks[key];
            } else {
                worldBlocks[key] = data.color;
            }
            drawWorld();
        });

        socket.on('clear_board', function() {
            worldBlocks = {};
            myHistory = []; 
            drawWorld();
        });

        socket.on('update_cursor', function(data) {
            if (data.id !== socket.id) {
                otherCursors[data.id] = {x: data.x, y: data.y, color: data.color};
                drawWorld();
            }
        });

        let isDrawing = false;
        let lastDraggedTile = null;

        function handleDrawing(event) {
            let rect = canvas.getBoundingClientRect();
            let mouseX = event.clientX - rect.left;
            let mouseY = event.clientY - rect.top;

            let broadcastColor = isEraser ? '#ff0000' : selectedColor; 
            socket.emit('mouse_move', {x: mouseX, y: mouseY, color: broadcastColor});

            if (!isDrawing) return;

            let gx = Math.floor(mouseX / TILE_SIZE);
            let gy = Math.floor(mouseY / TILE_SIZE);
            let tileKey = `${gx},${gy}`;

            // Prevent spamming the exact same tile while dragging inside it
            if (tileKey === lastDraggedTile) return;
            lastDraggedTile = tileKey;

            if (event.buttons === 1) {
                let paintColor = isEraser ? null : selectedColor;
                placeBlock(gx, gy, paintColor);
            } else if (event.buttons === 2) {
                placeBlock(gx, gy, null);
            }
        }

        canvas.addEventListener('mousedown', function(event) {
            isDrawing = true;
            let rect = canvas.getBoundingClientRect();
            let gx = Math.floor((event.clientX - rect.left) / TILE_SIZE);
            let gy = Math.floor((event.clientY - rect.top) / TILE_SIZE);
            lastDraggedTile = `${gx},${gy}`;

            if (event.button === 0) {
                let paintColor = isEraser ? null : selectedColor;
                placeBlock(gx, gy, paintColor);
            } else if (event.button === 2) {
                placeBlock(gx, gy, null);
            }
        });

        window.addEventListener('mouseup', function() {
            isDrawing = false;
            lastDraggedTile = null;
        });

        canvas.addEventListener('mousemove', handleDrawing);
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        window.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z') {
                event.preventDefault();
                undoAction();
            }
        });
    </script>

</body>
</html>
