<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Doodle Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        #controls {
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid white;
            background-color: white;
            cursor: crosshair;
        }
        .color-btn {
            width: 30px;
            height: 30px;
            display: inline-block;
            margin: 0 5px;
            border: 2px solid #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Little Doodle Game</h1>
    
    <div id="controls">
        <div class="color-btn" style="background-color: black;" onclick="setColor('black')"></div>
        <div class="color-btn" style="background-color: red;" onclick="setColor('red')"></div>
        <div class="color-btn" style="background-color: blue;" onclick="setColor('blue')"></div>
        <div class="color-btn" style="background-color: green;" onclick="setColor('green')"></div>
        <div class="color-btn" style="background-color: yellow;" onclick="setColor('yellow')"></div>
        <button onclick="clearCanvas()">Clear</button>
    </div>

    <canvas id="doodleCanvas" width="600" height="400"></canvas>

    <!-- Include Socket.IO client library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        const socket = io(); // Connects to the server automatically
        const canvas = document.getElementById('doodleCanvas');
        const ctx = canvas.getContext('2d');

        let drawing = false;
        let currentColor = 'black';

        function setColor(color) {
            currentColor = color;
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Track mouse movements for drawing
        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            draw(e);
        });

        canvas.addEventListener('mouseup', () => {
            drawing = false;
            ctx.beginPath();
        });

        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!drawing) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Draw locally
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = currentColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

            // Send drawing coordinates to the server so other players see it
            socket.emit('draw_pixel', { x: x, y: y, color: currentColor });
        }

        // Listen for drawing events from other players
        socket.on('update_pixel', (data) => {
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = data.color;
            
            // Render remote strokes (simplified single-point dot/line approach)
            ctx.lineTo(data.x, data.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(data.x, data.y);
        });
    </script>
</body>
</html>
